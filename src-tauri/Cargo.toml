[package]
name = "jx3-network-diagnostics"
version = "0.2.0"
description = "剑网三网络诊断"
edition = "2021"
default-run = "jx3-network-diagnostics"

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
tauri = { version = "2.5.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
encoding_rs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis",
  "Win32_NetworkManagement_WiFi", "Win32_Networking_WinSock", "Win32_Security",
  "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Diagnostics_Etw", "Win32_System_Time", "Win32_System_IO"
] }
