name: Build and publish Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish, for example v0.4.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Use crates.io on GitHub runner
        run: Remove-Item -LiteralPath .cargo/config.toml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: npm ci
      - name: Validate release and types
        shell: pwsh
        run: |
          npm run check
          if ($LASTEXITCODE -ne 0) { throw 'Release validation failed' }
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag must match application version' }
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Rust lint
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Build signed Windows release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Missing TAURI_SIGNING_PRIVATE_KEY' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          if (-not (Test-Path release/latest.json)) { throw 'Missing signed update manifest' }
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $tag = "v$version"
          # Keep incomplete uploads away from /releases/latest/download/latest.json.
          gh release view $tag --json isDraft 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            $existing = gh release view $tag --json isDraft | ConvertFrom-Json
            if (-not $existing.isDraft) { throw 'Release already published; use a new version.' }
          } else {
            gh release create $tag --verify-tag --draft --title "剑网三网络诊断 $tag" --notes-file release/release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release' }
          }
          gh release upload $tag "release/jx3-network-diagnostics-$version.exe" "release/jx3-network-diagnostics-$version-x64-setup.exe" "release/jx3-network-diagnostics-$version-x64-setup.exe.sig" release/latest.json release/SHA256SUMS.txt release/使用说明.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Upload failed; release remains a draft' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }
